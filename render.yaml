services:
  - type: web
    name: pathshala-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_BN_SSC
        sync: false
      - key: DATABASE_URL_EN
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-flash-lite-latest
      - key: LLM_FAST_MODEL
        value: gemini/gemini-flash-lite-latest
      - key: LLM_VERIFY_MODEL
        value: gemini/gemini-flash-lite-latest
      - key: EMBED_PROVIDER
        value: fts
      - key: MIN_SCORE
        value: "0.45"
      - key: REWRITE
        value: "0"
      - key: VERIFY
        value: "0"
      - key: EMBED_MODEL
        value: BAAI/bge-m3
      - key: EMBED_DIM
        value: "1024"

