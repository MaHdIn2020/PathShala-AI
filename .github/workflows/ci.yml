name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install fastapi uvicorn pydantic langgraph litellm psycopg ruff httpx mcp matplotlib scikit-learn numpy
      - name: Install web deps
        run: npm --prefix web ci
      - name: Run verify.sh
        run: bash scripts/verify.sh
